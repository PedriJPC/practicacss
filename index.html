<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dota 2 News - Práctica CSS</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: rgb(240, 240, 240);
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        #cabecera-principal {
            background-color: #2b2b2b;
            color: white;
            text-align: center;
            padding: 20px;
        }
        h1, h2 {
            color: red;
        }

        #menu-navegacion {
            background-color: #1a1a1a;
            padding: 10px;
            text-align: center;
        }

        #noticias {
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .noticia {
            background-color: white;
            border: 2px solid #333333;
            padding: 15px;
            margin: 15px 0;
            width: 100%;
        }
        .noticia h3 {
            color: darkred;
            font-size: 20px;
        }
        .categoria {
            background-color: lightgray;
            padding: 3px 6px;
            font-size: 12px;
            font-weight: bold;
        }
        #pie-pagina {
            background-color: #2b2b2b;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <header id="cabecera-principal">
        <h1>Dota 2 News</h1>
        <p>El portal oficial de la comunidad de Dota 2</p>
    </header>

    <nav id="menu-navegacion">
        <a href="#">Inicio</a>
        <a href="#">Parches</a>
        <a href="#">Esports</a>
        <a href="#">Guías</a>
    </nav>
